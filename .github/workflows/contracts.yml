name: Contract integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:api-coverage
      - run: npm run test:source-content
      - run: npm run test:gds-audit
      - run: node --test tests/api-coverage.test.mjs tests/api-contract-manifest.test.mjs tests/source-content.test.mjs
